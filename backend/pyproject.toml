[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv", "data", "mlruns", "test_mlflow_artifacts", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "B008",   # FastAPI Depends/Query in defaults is the framework idiom
  "E501",   # long explanatory strings are intentional in services
  "RUF059", # unpacked placeholders are sometimes clearer in tests
  "SIM105", # explicit try/except/pass documents intentional suppression
  "SIM108", # explicit branches are clearer for metric direction
  "UP046",  # Generic Page[...] keeps runtime typing compatibility
  "RUF001", # en dashes are intentional in statistical method names
  "RUF005", # explicit concatenation is clearer for feature lists
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning:mlflow.*",
  "ignore::DeprecationWarning:evidently.*",
  "ignore::DeprecationWarning:litestar.*",
]
